name: Generate Release Notes
on:
  workflow_run:
    workflows: ["Create Tag"]
    types:
      - completed
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      from_tag:
        description: 'Base tag to compare from (e.g., v1.2.1). Leave empty to use previous tag.'
        required: false
        type: string
      to_tag:
        description: 'Tag to compare to (e.g., v1.2.3). Leave empty to use latest tag.'
        required: false
        type: string
permissions:
  contents: write
  id-token: write
  actions: write
  issues: write
jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.git-cliff.outputs.content }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine changelog mode and trim inputs
        id: changelog-mode
        run: |
          # Trim whitespace from inputs
          FROM_TAG="${{ github.event.inputs.from_tag || '' }}"
          TO_TAG="${{ github.event.inputs.to_tag || '' }}"
          FROM_TAG=$(echo "$FROM_TAG" | xargs)
          TO_TAG=$(echo "$TO_TAG" | xargs)
          
          echo "from_tag=$FROM_TAG" >> $GITHUB_OUTPUT
          echo "to_tag=$TO_TAG" >> $GITHUB_OUTPUT
          
          if [[ "${{ github.event_name }}" == "push" || "$FROM_TAG" == "" || "$TO_TAG" == "" ]]; then
            echo "mode=default" >> $GITHUB_OUTPUT
          else
            echo "mode=custom" >> $GITHUB_OUTPUT
          fi
      - name: Generate changelog (default - latest)
        if: steps.changelog-mode.outputs.mode == 'default'
        uses: orhun/git-cliff-action@v4
        id: git-cliff-default
        with:
          config: cliff.toml
          args: -vv --latest --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Generate changelog (custom tag range)
        if: steps.changelog-mode.outputs.mode == 'custom'
        uses: orhun/git-cliff-action@v4
        id: git-cliff-custom
        with:
          config: cliff.toml
          args: -vv --tag ${{ steps.changelog-mode.outputs.from_tag }}..${{ steps.changelog-mode.outputs.to_tag }} --strip header
        env:
          OUTPUT: CHANGES.md
          GITHUB_REPO: ${{ github.repository }}
      - name: Create Release Notes
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.changelog-mode.outputs.mode == 'default' && steps.git-cliff-default.outputs.content || steps.git-cliff-custom.outputs.content }}
          tag_name: ${{ github.event_name == 'workflow_dispatch' && steps.changelog-mode.outputs.to_tag != '' && steps.changelog-mode.outputs.to_tag || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
