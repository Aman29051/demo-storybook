name: Generate Changelog & Draft Release
on:
  workflow_dispatch:
    inputs:
      prev_tag:
        description: 'Previous Tag'
        required: true
        type: string
        default: ''
      latest_tag:
        description: 'Latest Tag'
        required: true
        type: string
        default: ''
  repository_dispatch:
    types: [prod-deployment]

permissions:
  contents: write
  pull-requests: write
  deployments: read

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: List Latest Production Deployments
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "=== Latest Production Deployments ==="
          
          # Get deployments using GitHub API
          curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/deployments?environment=production&per_page=10" \
            | jq -r '.[] | select(.environment == "production") | "\(.created_at) | \(.ref) | \(.sha[0:7]) | \(.id)"' \
            | head -5 \
            | while IFS='|' read -r created_at ref sha deployment_id; do
                echo "Deployment ID: $(echo $deployment_id | xargs)"
                echo "  Created: $(echo $created_at | xargs)"
                echo "  Ref: $(echo $ref | xargs)"
                echo "  SHA: $(echo $sha | xargs)"
                echo "  ---"
              done
          
          echo ""
          echo "=== Top 2 Latest Production Deployments (Detailed) ==="
          
          # Get top 2 deployments with more details
          DEPLOYMENTS=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/deployments?environment=production&per_page=2")
          
          echo "$DEPLOYMENTS" | jq -r '
            .[] | 
            "=== Deployment \(.id) ===",
            "Created: \(.created_at)",
            "Environment: \(.environment)", 
            "Ref: \(.ref)",
            "SHA: \(.sha)",
            "Description: \(.description // "No description")",
            ""'

      # - name: Extract current and previous tags
