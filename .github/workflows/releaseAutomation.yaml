name: Jira Cherry-pick Labeler
on:
  repository_dispatch:
    types: [jira_ready_to_cherrypick]
  workflow_dispatch:
    inputs:
      TICKET_KEY:
        description: 'Jira ticket key (e.g., ABC-123)'
        required: true
        type: string
      LABEL_TEXT:
        description: 'Label to add to PRs'
        required: true
        type: string

jobs:
  label_prs:
    runs-on: ubuntu-latest
    steps:
      - name: Extract payload
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "TICKET_KEY=${{ github.event.inputs.TICKET_KEY }}" >> $GITHUB_ENV
            echo "LABEL_TEXT=${{ github.event.inputs.LABEL_TEXT }}" >> $GITHUB_ENV
          else
            echo "TICKET_KEY=${{ github.event.client_payload.ticket_key }}" >> $GITHUB_ENV
            echo "LABEL_TEXT=${{ github.event.client_payload.label_text }}" >> $GITHUB_ENV
          fi

      - name: Fetch linked PRs from Jira
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_DOMAIN: ${{ secrets.JIRA_DOMAIN }}
        run: |
          echo "🎯 Starting PR discovery for ticket: ${TICKET_KEY}"
          echo "📋 Using Jira domain: ${JIRA_DOMAIN}"
          echo "👤 Using Jira email: ${JIRA_EMAIL}"
          echo ""
          
          # Validate required environment variables
          if [[ -z "${TICKET_KEY}" || -z "${JIRA_DOMAIN}" || -z "${JIRA_EMAIL}" || -z "${JIRA_API_TOKEN}" ]]; then
            echo "❌ Error: Missing required environment variables"
            echo "TICKET_KEY: ${TICKET_KEY:-'NOT SET'}"
            echo "JIRA_DOMAIN: ${JIRA_DOMAIN:-'NOT SET'}"  
            echo "JIRA_EMAIL: ${JIRA_EMAIL:-'NOT SET'}"
            echo "JIRA_API_TOKEN: ${JIRA_API_TOKEN:+'SET'}"
            exit 1
          fi
          
          echo "🔍 Fetching issue data from Jira..."
          JIRA_RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" -u $JIRA_EMAIL:$JIRA_API_TOKEN \
            "https://$JIRA_DOMAIN.atlassian.net/rest/api/2/issue/${TICKET_KEY}?fields=customfield_10000,summary&expand=names")
          
          HTTP_STATUS=$(echo "$JIRA_RESPONSE" | grep -o "HTTP_STATUS:[0-9]*" | cut -d: -f2)
          RESPONSE_BODY=$(echo "$JIRA_RESPONSE" | sed 's/HTTP_STATUS:[0-9]*$//')
          
          echo "📡 HTTP Status: $HTTP_STATUS"
          
          if [[ "$HTTP_STATUS" != "200" ]]; then
            echo "❌ Failed to fetch Jira issue"
            echo "Response: $RESPONSE_BODY"
            if [[ "$HTTP_STATUS" == "401" ]]; then
              echo "🔐 Authentication failed. Check JIRA_EMAIL and JIRA_API_TOKEN"
            elif [[ "$HTTP_STATUS" == "404" ]]; then
              echo "🔍 Ticket not found. Check TICKET_KEY and permissions"
            fi
            exit 1
          fi
          
          echo "✅ Successfully fetched Jira issue data"
          
          # Extract the issue ID from the response
          ISSUE_ID=$(echo "$RESPONSE_BODY" | jq -r '.id')
          echo "🆔 Issue ID: $ISSUE_ID"
          
          # Extract development information from customfield_10000
          DEV_FIELD=$(echo "$RESPONSE_BODY" | jq -r '.fields.customfield_10000 // empty')
          
          if [[ -z "$DEV_FIELD" ]]; then
            echo "❌ No development information found in Jira issue"
            echo "This means either:"
            echo "  - No PRs are linked to this ticket"
            echo "  - Jira-GitHub integration is not configured"
            echo "  - The development field is in a different custom field"
            exit 0
          fi
          
          echo "🔗 Found development field data"
          echo "Development field content: $DEV_FIELD"
          
          # Parse the development field to extract PR count
          PR_COUNT=$(echo "$DEV_FIELD" | grep -o 'stateCount=[0-9]*' | cut -d= -f2)
          PR_STATE=$(echo "$DEV_FIELD" | grep -o 'state=[A-Z]*' | cut -d= -f2)
          
          echo "📊 PR Statistics from Jira:"
          echo "  Total PRs: ${PR_COUNT:-0}"
          echo "  Overall State: ${PR_STATE:-UNKNOWN}"
          
          if [[ -z "$PR_COUNT" || "$PR_COUNT" == "0" ]]; then
            echo "❌ No PRs found linked to ticket ${TICKET_KEY}"
            exit 0
          fi
          
          echo ""
          echo "🚀 Fetching detailed PR information..."
          
          # Try multiple API endpoints with different application types
          
          APPLICATION_TYPES=("github" "stash" "bitbucket")
          SUCCESS=false
          
          for APP_TYPE in "${APPLICATION_TYPES[@]}"; do
            if [[ "$SUCCESS" == "true" ]]; then
              break
            fi
            
            echo "🔄 Method ${#APPLICATION_TYPES[@]}: Trying dev-status detail API with applicationType=${APP_TYPE}..."
            
            # Try with issue key first
            DEV_RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" -u $JIRA_EMAIL:$JIRA_API_TOKEN \
              "https://$JIRA_DOMAIN.atlassian.net/rest/dev-status/1.0/issue/details?issueIdOrKey=${TICKET_KEY}&applicationType=${APP_TYPE}&dataType=pullrequest")
            
            DEV_HTTP_STATUS=$(echo "$DEV_RESPONSE" | grep -o "HTTP_STATUS:[0-9]*" | cut -d: -f2)
            DEV_RESPONSE_BODY=$(echo "$DEV_RESPONSE" | sed 's/HTTP_STATUS:[0-9]*$//')
            
            echo "📡 Development API (${APP_TYPE} with key) HTTP Status: $DEV_HTTP_STATUS"
            
            if [[ "$DEV_HTTP_STATUS" == "200" ]] && echo "$DEV_RESPONSE_BODY" | jq -e '.detail[0].pullRequests' > /dev/null 2>&1; then
              SUCCESS=true
              echo "✅ Success with applicationType=${APP_TYPE} and issue key"
            elif [[ "$DEV_HTTP_STATUS" != "200" ]]; then
              # Try with numeric issue ID
              echo "🔄 Trying with issue ID for applicationType=${APP_TYPE}..."
              DEV_RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" -u $JIRA_EMAIL:$JIRA_API_TOKEN \
                "https://$JIRA_DOMAIN.atlassian.net/rest/dev-status/1.0/issue/details?issueIdOrKey=${ISSUE_ID}&applicationType=${APP_TYPE}&dataType=pullrequest")
              
              DEV_HTTP_STATUS=$(echo "$DEV_RESPONSE" | grep -o "HTTP_STATUS:[0-9]*" | cut -d: -f2)
              DEV_RESPONSE_BODY=$(echo "$DEV_RESPONSE" | sed 's/HTTP_STATUS:[0-9]*$//')
              
              echo "📡 Development API (${APP_TYPE} with ID) HTTP Status: $DEV_HTTP_STATUS"
              
              if [[ "$DEV_HTTP_STATUS" == "200" ]] && echo "$DEV_RESPONSE_BODY" | jq -e '.detail[0].pullRequests' > /dev/null 2>&1; then
                SUCCESS=true
                echo "✅ Success with applicationType=${APP_TYPE} and issue ID"
              fi
            fi
            
            if [[ "$SUCCESS" != "true" ]]; then
              echo "❌ Failed with applicationType=${APP_TYPE}"
            fi
          done
          
          # If all detail endpoints failed, try the summary endpoint one more time
          if [[ "$SUCCESS" != "true" ]]; then
            echo "🔄 Final attempt: Trying dev-status summary API..."
            DEV_RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" -u $JIRA_EMAIL:$JIRA_API_TOKEN \
              "https://$JIRA_DOMAIN.atlassian.net/rest/dev-status/latest/issue/summary?issueId=${ISSUE_ID}")
            
            DEV_HTTP_STATUS=$(echo "$DEV_RESPONSE" | grep -o "HTTP_STATUS:[0-9]*" | cut -d: -f2)
            DEV_RESPONSE_BODY=$(echo "$DEV_RESPONSE" | sed 's/HTTP_STATUS:[0-9]*$//')
            
            echo "📡 Development Summary API HTTP Status: $DEV_HTTP_STATUS"
          fi
          
          if [[ "$DEV_HTTP_STATUS" == "200" ]]; then
            echo "✅ Successfully fetched development details"
            
            # Check if we have pullRequests in the response
            if echo "$DEV_RESPONSE_BODY" | jq -e '.detail[0].pullRequests' > /dev/null 2>&1; then
              echo "📦 Extracting merged PRs..."
              
              # Get all PRs and sort by lastUpdate (merge date) in ascending order
              ALL_PRS=$(echo "$DEV_RESPONSE_BODY" | jq -r '
                .detail[0].pullRequests[]? 
                | "\(.lastUpdate // "1970-01-01T00:00:00.000Z") \(.status) \(.repository.name) \(.url) \(.displayId)"')
              
              if [[ -n "$ALL_PRS" ]]; then
                echo ""
                echo "📋 All PRs found:"
                echo "$ALL_PRS" | while read -r timestamp status repo url displayId; do
                  echo "  [$status] $repo PR #$displayId - $timestamp"
                done
                echo ""
                
                # Filter only merged PRs and sort by timestamp
                MERGED_PRS=$(echo "$ALL_PRS" | grep " MERGED " | sort)
                
                if [[ -n "$MERGED_PRS" ]]; then
                  echo "✅ Merged PRs (sorted by merge date, earliest first):"
                  echo "$MERGED_PRS" | while read -r timestamp status repo url displayId; do
                    echo "  $repo PR #$displayId - merged at $timestamp"
                  done
                  
                  # Save to file for processing (remove timestamp and status for clean format)
                  echo "$MERGED_PRS" | while read -r timestamp status repo url displayId; do
                    echo "$repo $url"
                  done > prs.txt
                  
                  echo ""
                  echo "📄 Saved $(wc -l < prs.txt) merged PRs to file"
                else
                  echo "❌ No merged PRs found (all PRs are still open or in other states)"
                  touch prs.txt
                fi
              else
                echo "❌ No PRs found in development response"
                touch prs.txt
              fi
            else
              echo "❌ No pullRequests found in development API response"
              echo "Response structure: $(echo "$DEV_RESPONSE_BODY" | jq -c '.')"
              touch prs.txt
            fi
          else
            echo "❌ Failed to fetch development details"
            echo "Response: $DEV_RESPONSE_BODY"
            
            # Try alternative approach - parse the development field directly
            echo ""
            echo "🔄 Method 4: Parsing development field JSON directly..."
            
            # The development field contains cached PR information
            echo "Development field JSON structure:"
            echo "$DEV_FIELD" | jq '.' 2>/dev/null || echo "Not valid JSON format"
            echo ""
            
            # Try multiple ways to extract PR information from the cached data
            # First, try to get the full cached value
            CACHED_JSON=$(echo "$DEV_FIELD" | jq -r '.json' 2>/dev/null | jq -r '.cachedValue // empty' 2>/dev/null)
            
            if [[ -n "$CACHED_JSON" && "$CACHED_JSON" != "null" && "$CACHED_JSON" != "empty" ]]; then
              echo "✅ Found cached development data"
              echo "Cached data: $CACHED_JSON"
              
              # Try to extract PR URLs from various possible paths in the cached data
              PR_URLS=$(echo "$CACHED_JSON" | jq -r '.summary.pullrequest.byInstanceType.GitHub.pullRequests[]?.url // empty' 2>/dev/null)
              
              if [[ -z "$PR_URLS" ]]; then
                # Try alternative path structures
                PR_URLS=$(echo "$CACHED_JSON" | jq -r '.details[].pullRequests[]?.url // empty' 2>/dev/null)
              fi
              
              if [[ -z "$PR_URLS" ]]; then
                # Try to find any URL that looks like a GitHub PR
                PR_URLS=$(echo "$CACHED_JSON" | grep -o 'https://github.com/[^/]*/[^/]*/pull/[0-9]*' 2>/dev/null || true)
              fi
            else
              echo "❌ No valid cached JSON found"
              
              # Last resort: try to extract GitHub URLs directly from the development field string
              echo "🔍 Last resort: Looking for GitHub URLs in development field..."
              PR_URLS=$(echo "$DEV_FIELD" | grep -o 'https://github.com/[^/]*/[^/]*/pull/[0-9]*' 2>/dev/null || true)
            fi
            
            if [[ -n "$PR_URLS" ]]; then
              echo "✅ Found PR URLs:"
              echo "$PR_URLS" | while read -r url; do
                if [[ -n "$url" && "$url" != "null" ]]; then
                  # Extract repo and PR number from GitHub URL
                  REPO=$(echo "$url" | sed 's|https://github.com/||' | cut -d'/' -f1,2)
                  echo "  $REPO - $url"
                  echo "$REPO $url" >> prs.txt
                fi
              done
            else
              echo "❌ Could not find any PR URLs in development field"
              echo ""
              echo "🔍 Debug: Full development field structure:"
              echo "$DEV_FIELD" | jq '.' 2>/dev/null || echo "$DEV_FIELD"
              echo ""
              echo "💡 Possible solutions:"
              echo "  1. Check if GitHub integration is properly configured in Jira"
              echo "  2. Verify that PRs were actually linked to this Jira ticket"
              echo "  3. Check if the development field uses a different custom field ID"
              echo "  4. Ensure the API user has permissions to access development data"
              
              # Try to get all custom fields to see if development info is in a different field
              echo ""
              echo "🔍 Checking for development info in other custom fields..."
              ALL_CUSTOM_FIELDS=$(echo "$RESPONSE_BODY" | jq -r '.fields | to_entries[] | select(.key | startswith("customfield_")) | "\(.key): \(.value)"' 2>/dev/null || true)
              
              if [[ -n "$ALL_CUSTOM_FIELDS" ]]; then
                echo "Custom fields containing 'pull' or 'github' or 'development':"
                echo "$ALL_CUSTOM_FIELDS" | grep -i -E "(pull|github|development|branch|commit)" || echo "  None found"
              fi
              
              touch prs.txt
            fi
          fi
          
          if [[ -s prs.txt ]]; then
            echo ""
            echo "🎉 Final result - PRs ready for labeling:"
            cat prs.txt
          else
            echo ""
            echo "⚠️  No merged PRs found to label"
          fi

      - name: Add label to each PR sequentially
        run: |
          echo ""
          echo "🏷️  Starting PR labeling process..."
          echo "Label to add: '${LABEL_TEXT}'"
          echo ""
          
          if [[ ! -s prs.txt ]]; then
            echo "ℹ️  No PRs to process - skipping labeling step"
            exit 0
          fi
          
          TOTAL_PRS=$(wc -l < prs.txt)
          CURRENT_PR=0
          
          echo "📊 Processing $TOTAL_PRS PRs..."
          echo ""
          
          while IFS=' ' read -r repo pr_url; do
            # Skip empty lines
            [[ -z "$repo" || -z "$pr_url" ]] && continue
            
            CURRENT_PR=$((CURRENT_PR + 1))
            pr_number=$(basename "$pr_url")
            
            echo "[$CURRENT_PR/$TOTAL_PRS] 🔧 Processing $repo PR #$pr_number"
            
            # Validate PR number is numeric
            if ! [[ "$pr_number" =~ ^[0-9]+$ ]]; then
              echo "  ❌ Invalid PR number: $pr_number, skipping"
              continue
            fi
            
            # Check if label already exists in repository
            echo "  🔍 Checking if label '${LABEL_TEXT}' exists in $repo..."
            # LABEL_CHECK_RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            #   "https://api.github.com/repos/${{ github.repository_owner }}/$repo/labels/${LABEL_TEXT}")
            
            # LABEL_HTTP_STATUS=$(echo "$LABEL_CHECK_RESPONSE" | grep -o "HTTP_STATUS:[0-9]*" | cut -d: -f2)
            
            # if [[ "$LABEL_HTTP_STATUS" == "404" ]]; then
            #   echo "  📝 Creating label '${LABEL_TEXT}' in $repo..."
            #   CREATE_RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" -X POST \
            #     -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            #     -H "Accept: application/vnd.github+json" \
            #     "https://api.github.com/repos/${{ github.repository_owner }}/$repo/labels" \
            #     -d "{\"name\":\"${LABEL_TEXT}\", \"color\":\"0E8A16\", \"description\":\"Ready for cherry-pick\"}")
              
            #   CREATE_HTTP_STATUS=$(echo "$CREATE_RESPONSE" | grep -o "HTTP_STATUS:[0-9]*" | cut -d: -f2)
              
            #   if [[ "$CREATE_HTTP_STATUS" == "201" ]]; then
            #     echo "  ✅ Label created successfully"
            #   else
            #     echo "  ⚠️  Failed to create label (status: $CREATE_HTTP_STATUS)"
            #   fi
            # elif [[ "$LABEL_HTTP_STATUS" == "200" ]]; then
            #   echo "  ✅ Label already exists"
            # else
            #   echo "  ⚠️  Error checking label (status: $LABEL_HTTP_STATUS)"
            # fi
            
            # Add label to PR
            echo "  🏷️  Adding label to PR #$pr_number..."
            # ADD_RESPONSE=$(curl -s -w "HTTP_STATUS:%{http_code}" -X POST \
            #   -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            #   -H "Accept: application/vnd.github+json" \
            #   "https://api.github.com/repos/${{ github.repository_owner }}/$repo/issues/$pr_number/labels" \
            #   -d "{\"labels\":[\"${LABEL_TEXT}\"]}")
            
            # ADD_HTTP_STATUS=$(echo "$ADD_RESPONSE" | grep -o "HTTP_STATUS:[0-9]*" | cut -d: -f2)
            # ADD_RESPONSE_BODY=$(echo "$ADD_RESPONSE" | sed 's/HTTP_STATUS:[0-9]*$//')
            
            # if [[ "$ADD_HTTP_STATUS" == "200" ]]; then
            #   # Verify the label was actually added
            #   if echo "$ADD_RESPONSE_BODY" | jq -e --arg label "${LABEL_TEXT}" '.[] | select(.name == $label)' > /dev/null 2>&1; then
            #     echo "  ✅ Successfully added label to $repo PR #$pr_number"
            #   else
            #     echo "  ⚠️  Label might not have been added properly"
            #   fi
            # else
            #   echo "  ❌ Failed to add label to $repo PR #$pr_number (status: $ADD_HTTP_STATUS)"
            #   if [[ "$ADD_HTTP_STATUS" == "404" ]]; then
            #     echo "     💡 PR might not exist or repository might not be accessible"
            #   elif [[ "$ADD_HTTP_STATUS" == "403" ]]; then
            #     echo "     💡 Insufficient permissions to add labels"
            #   fi
            # fi
            
            # Rate limiting
            if [[ $CURRENT_PR -lt $TOTAL_PRS ]]; then
              echo "  ⏱️  Waiting 2 seconds before next PR..."
              sleep 2
            fi
            
            echo ""
            
          done < prs.txt
          
          echo "🎉 PR labeling process completed!"
          echo "   Processed: $CURRENT_PR PRs"
          echo "   Label: '${LABEL_TEXT}'"
