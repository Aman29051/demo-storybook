name: Generate Changelog & Draft Release

on:
  repository_dispatch:
    types: [kustomization_changed]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout auth-service repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone nodeapp repo
        run: |
          # git clone https://github.com/Aman29051/nodeapp.git
          git clone https://Aman29051:${{ secrets.PERSONAL_ACCESS_TOKEN }}@github.com/Aman29051/nodeapp.git
          cat nodeapp/prod/kustomization.yaml > kustomization.yaml

      - name: Extract latest tag
        id: extract
        run: |
          latest_line=$(grep 'newTag:' kustomization.yaml | grep 'auth-service:' | head -1)
          latest_tag=$(echo "$latest_line" | awk -F ':' '{print $2}' | awk -F '_' '{print $1}' | xargs)
          echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT

          # Get previous commit's tag value for comparison
          git -C nodeapp log -p -1 -- prod/kustomization.yaml > last_diff.txt
          prev_tag=$(grep '+  - name: .*auth-service' last_diff.txt | grep 'newTag:' | awk -F ':' '{print $3}' | awk -F '_' '{print $1}' | tail -1 | xargs)
          echo "prev_tag=$prev_tag" >> $GITHUB_OUTPUT

      - name: Generate changelog between tags
        id: changelog
        run: |
          git fetch --tags
          logs=$(git log ${{ steps.extract.outputs.prev_tag }}..${{ steps.extract.outputs.latest_tag }} --pretty=format:"%s")
          echo "$logs" > raw_changelog.txt

          # Create formatted changelog
          echo "## Changelog from ${{ steps.extract.outputs.prev_tag }} to ${{ steps.extract.outputs.latest_tag }}" > CHANGELOG.md
          while IFS= read -r line; do
            pr_number=$(echo "$line" | grep -oP '#\K[0-9]+')
            jira_key=$(echo "$line" | grep -oP '[A-Z]+-[0-9]+')
            if [[ ! -z "$pr_number" && ! -z "$jira_key" ]]; then
              echo "- [${jira_key}](https://worth-ai.atlassian.net/browse/${jira_key}) $line [#${pr_number}](https://github.com/<your-org>/auth-service/pull/${pr_number})" >> CHANGELOG.md
            else
              echo "- $line" >> CHANGELOG.md
            fi
          done < raw_changelog.txt

      - name: Create Pull Request with changelog
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update changelog for ${{ steps.extract.outputs.latest_tag }}"
          title: "#NO_JIRA: #LIVE Release: ${{ steps.extract.outputs.latest_tag }} - Changelog Update"
          body: "This PR contains the changelog for the new release."
          branch: "release/changelog-${{ steps.extract.outputs.latest_tag }}"
          base: main
          add-paths: CHANGELOG.md

      - name: Create GitHub draft release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.extract.outputs.latest_tag }}
          name: Release ${{ steps.extract.outputs.latest_tag }}
          body_path: CHANGELOG.md
          draft: true
