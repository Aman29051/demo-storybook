name: Generate Changelog & Draft Release

on:
  repository_dispatch:
    types: [kustomization_changed]

permissions:
  contents: write
  pull-requests: write
  
env:
  SERVICE_NAME: "demo-storybook"
  DEPLOY_REPO_OWNER: "Aman29051"
  DEPLOY_REPO_NAME: "nodeapp"
  KUSTOMIZATION_PATH: "prod/kustomization.yaml"
  JIRA_BASE_URL: "https://worth-ai.atlassian.net/browse"

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone deployment repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEPLOY_REPO_OWNER }}/${{ env.DEPLOY_REPO_NAME }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: deploy-repo
          fetch-depth: 0

      - name: Extract current and previous tags
        run: |
          cd deploy-repo
          
          # Get current tag from kustomization.yaml
          CURRENT_TAG=$(yq eval '.images[0].newTag' "${{ env.KUSTOMIZATION_PATH }}")
          
          # Get previous commit hash
          PREV_COMMIT=$(git log --pretty=format:"%H" -n 1 HEAD~1)
          
          # Get previous tag from kustomization.yaml at previous commit
          PREV_TAG=$(git show $PREV_COMMIT:${{ env.KUSTOMIZATION_PATH }} | yq eval '.images[0].newTag' -)

          # Extract values before the underscore
          CURRENT_TAG_CLEAN=$(echo "$CURRENT_TAG" | cut -d'_' -f1)
          PREV_TAG_CLEAN=$(echo "$PREV_TAG" | cut -d'_' -f1)
      
          echo "CURRENT_TAG=$CURRENT_TAG_CLEAN" >> $GITHUB_ENV
          echo "PREV_TAG=$PREV_TAG_CLEAN" >> $GITHUB_ENV
      
          echo "Previous tag: $PREV_TAG_CLEAN"
          echo "Current tag:  $CURRENT_TAG_CLEAN"

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        id: git-cliff
        with:
          config: cliff.toml
          args: -vv --tag ${{ env.PREV_TAG }}..${{ env.CURRENT_TAG }} --strip header
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Create Release Notes
        uses: softprops/action-gh-release@v1
        with:
          body: ${{ steps.git-cliff.outputs.content }}
          tag_name: ${{ env.CURRENT_TAG }}
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Commit, push changelog, and create PR
        run: |
          TARGET_BRANCH="chore/update-changelog-${{ env.CURRENT_TAG }}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_ENV

          git config user.email "amanyadav63721@gmail.com"
          git config user.name "Aman29051"
          
          echo "${{ secrets.PERSONAL_ACCESS_TOKEN }}" > token.txt
          gh auth login --with-token < token.txt

          git checkout -b "$TARGET_BRANCH"
          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG for ${{ env.CURRENT_TAG }}" || echo "No changes to commit"
          git push origin "$TARGET_BRANCH"

          gh pr create \
            --body "This PR generates the `CHANGELOG.md` file to reflect changes from `${{ env.PREV_TAG }}` to `${{ env.CURRENT_TAG }}`." \
            --title "#NO_JIRA: #LIVE Generate  CHANGELOG for ${{ env.CURRENT_TAG }}" \
            --head "$TARGET_BRANCH" \
            --base "main"
