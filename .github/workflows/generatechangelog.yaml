name: Generate Changelog & Draft Release

on:
  repository_dispatch:
    types: [kustomization_changed]

env:
  SERVICE_NAME: "demo-storybook"
  DEPLOY_REPO_OWNER: "Aman29051"
  DEPLOY_REPO_NAME: "nodeapp"
  KUSTOMIZATION_PATH: "prod/kustomization.yaml"
  CONTAINER_REGISTRY: "808338307022.dkr.ecr.us-east-1.amazonaws.com"
  JIRA_BASE_URL: "https://worth-ai.atlassian.net/browse"

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone deployment repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEPLOY_REPO_OWNER }}/${{ env.DEPLOY_REPO_NAME }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: deploy-repo
          fetch-depth: 0

      - name: Extract current and previous tags
        run: |
          cd deploy-repo
          
          # Get current tag from kustomization.yaml
          CURRENT_TAG=$(yq eval '.images[0].newTag' "${{ env.KUSTOMIZATION_PATH }}")
          echo "CURRENT_TAG=$CURRENT_TAG" >> $GITHUB_ENV
          
          # Get previous commit hash
          PREV_COMMIT=$(git log --pretty=format:"%H" -n 1 HEAD~1)
          echo "Previous commit: $PREV_COMMIT"
          
          # Get previous tag from kustomization.yaml at previous commit
          PREV_TAG=$(git show $PREV_COMMIT:${{ env.KUSTOMIZATION_PATH }} | yq eval '.images[0].newTag' -)
          echo "PREV_TAG=$PREV_TAG" >> $GITHUB_ENV

          echo "Previous commit tag: $PREV_TAG"
          echo "Current commit tag:  $CURRENT_TAG"
          
      - name: Extract version tags
        id: tags
        run: |
          # Extract current tag
          CURRENT_TAG=$(grep -A 1 "name: ${{ env.CONTAINER_REGISTRY }}/${{ env.SERVICE_NAME }}" deploy-repo/${{ env.KUSTOMIZATION_PATH }} | grep "newTag:" | sed 's/.*newTag: //' | tr -d ' ' | cut -d'_' -f1)
          
          # Extract previous tag
          cd deploy-repo
          PREV_COMMIT=$(git log -2 --format="%H" -- ${{ env.KUSTOMIZATION_PATH }} | tail -1)
          PREV_TAG=$(git show $PREV_COMMIT:${{ env.KUSTOMIZATION_PATH }} 2>/dev/null | grep -A 1 "name: ${{ env.CONTAINER_REGISTRY }}/${{ env.SERVICE_NAME }}" | grep "newTag:" | sed 's/.*newTag: //' | tr -d ' ' | cut -d'_' -f1 2>/dev/null || echo "")
          cd ..

          echo "current=$CURRENT_TAG"
          echo "previous=$PREV_TAG"
          
          echo "current=$CURRENT_TAG" >> $GITHUB_OUTPUT
          echo "previous=$PREV_TAG" >> $GITHUB_OUTPUT
          
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" == "$CURRENT_TAG" ]; then
            echo "generate=false" >> $GITHUB_OUTPUT
          else
            echo "generate=true" >> $GITHUB_OUTPUT
          fi

      - name: Generate changelog
        if: steps.tags.outputs.generate == 'true'
        run: |
          # Get commits between tags
          COMMITS=$(git log --oneline "${{ steps.tags.outputs.previous }}..${{ steps.tags.outputs.current }}" 2>/dev/null || git log --oneline HEAD~5..HEAD)
          
          # Create changelog
          cat > CHANGELOG.md << 'EOF'
          # Changelog for ${{ env.SERVICE_NAME }} Release ${{ steps.tags.outputs.current }}
          
          **Service:** ${{ env.SERVICE_NAME }}  
          **Release Date:** $(date '+%Y-%m-%d')  
          **Previous Version:** ${{ steps.tags.outputs.previous }}  
          **Current Version:** ${{ steps.tags.outputs.current }}
          
          ## Changes
          
          EOF
          
          # Process commits with link replacements
          echo "$COMMITS" | while read -r line; do
            hash=$(echo "$line" | cut -d' ' -f1)
            msg=$(echo "$line" | cut -d' ' -f2-)
            
            # Replace Jira tickets with links
            msg=$(echo "$msg" | sed -E 's/(PAT-[0-9]+)/[\1](${{ env.JIRA_BASE_URL }}\/\1)/g')
            
            # Replace PR numbers with links  
            msg=$(echo "$msg" | sed -E 's/\(#([0-9]+)\)/([#\1](https:\/\/github.com\/${{ github.repository }}\/pull\/\1))/g')
            
            echo "- **$hash**: $msg" >> CHANGELOG.md
          done
          
          # Add footer
          cat >> CHANGELOG.md << 'EOF'
          
          ## Deployment Information
          
          - **Service:** ${{ env.SERVICE_NAME }}
          - **Environment:** Production
          - **Container Image:** ${{ env.CONTAINER_REGISTRY }}/${{ env.SERVICE_NAME }}:${{ steps.tags.outputs.current }}
          
          ---
          *Auto-generated changelog for ${{ env.SERVICE_NAME }}*
          EOF

      - name: Create draft release
        if: steps.tags.outputs.generate == 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tags.outputs.current }}
          name: "${{ env.SERVICE_NAME }} Release ${{ steps.tags.outputs.current }}"
          body_path: CHANGELOG.md
          draft: true

      - name: Setup changelog file
        if: steps.tags.outputs.generate == 'true'
        run: |
          mkdir -p changelogs
          cp CHANGELOG.md "changelogs/CHANGELOG_${{ env.SERVICE_NAME }}_${{ steps.tags.outputs.current }}.md"

      - name: Create changelog PR
        if: steps.tags.outputs.generate == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "📋 Add changelog for ${{ env.SERVICE_NAME }} release ${{ steps.tags.outputs.current }}"
          title: "📋 [${{ env.SERVICE_NAME }}] Changelog for Release ${{ steps.tags.outputs.current }}"
          body: |
            ## Changelog for ${{ env.SERVICE_NAME }} Release ${{ steps.tags.outputs.current }}

            **Previous Version:** ${{ steps.tags.outputs.previous }}  
            **Current Version:** ${{ steps.tags.outputs.current }}  
            **Deploy Repository:** ${{ env.DEPLOY_REPO_OWNER }}/${{ env.DEPLOY_REPO_NAME }}

            Auto-generated from kustomization changes.
          branch: changelog/${{ env.SERVICE_NAME }}-${{ steps.tags.outputs.current }}
          labels: |
            changelog
            automated
            ${{ env.SERVICE_NAME }}
          add-paths: |
            changelogs/CHANGELOG_${{ env.SERVICE_NAME }}_${{ steps.tags.outputs.current }}.md
