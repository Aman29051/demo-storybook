name: Generate Changelog & Draft Release

on:
  repository_dispatch:
    types: [kustomization_changed]

permissions:
  contents: write
  pull-requests: write
  
env:
  DEPLOY_REPO_OWNER: "Aman29051"
  DEPLOY_REPO_NAME: "nodeapp"
  KUSTOMIZATION_PATH: "prod/kustomization.yaml"

jobs:
  generate-changelog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone deployment repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.DEPLOY_REPO_OWNER }}/${{ env.DEPLOY_REPO_NAME }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          path: deploy-repo
          fetch-depth: 0

      - name: Extract current and previous tags
        run: |
          cd deploy-repo
          
          # Get current tag from kustomization.yaml
          CURRENT_TAG=$(yq eval '.images[0].newTag' "${{ env.KUSTOMIZATION_PATH }}")
          
          # Get previous commit hash
          PREV_COMMIT=$(git log --pretty=format:"%H" -n 1 HEAD~1)
          
          # Get previous tag from kustomization.yaml at previous commit
          PREV_TAG=$(git show $PREV_COMMIT:${{ env.KUSTOMIZATION_PATH }} | yq eval '.images[0].newTag' -)

          # Extract values before the underscore
          CURRENT_TAG_CLEAN=$(echo "$CURRENT_TAG" | cut -d'_' -f1)
          PREV_TAG_CLEAN=$(echo "$PREV_TAG" | cut -d'_' -f1)
      
          echo "CURRENT_TAG=$CURRENT_TAG_CLEAN" >> $GITHUB_ENV
          echo "PREV_TAG=$PREV_TAG_CLEAN" >> $GITHUB_ENV
      
          echo "Previous tag: $PREV_TAG_CLEAN"
          echo "Current tag:  $CURRENT_TAG_CLEAN"

      - name: Create cliff.toml config
        run: |
          cat > cliff.toml << 'EOF'
          [changelog]
          header = """
          # Changelog\n
          All notable changes to this project will be documented in this file.\n
          """
          body = """
          {% if version %}\
              ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
          {% else %}\
              ## [unreleased]
          {% endif %}\
          {% for group, commits in commits | group_by(attribute="group") %}
              ### {{ group | striptags | trim | upper_first }}
              {% for commit in commits %}
                  - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
                      {% if commit.breaking %}[**breaking**] {% endif %}\
                      {{ commit.message | upper_first }}\
              {% endfor %}
          {% endfor %}\n
          """
          footer = """
          <!-- generated by git-cliff -->
          """
          trim = true
          render_always = true
          postprocessors = [
              { pattern = '([A-Z]+-[0-9]+)', replace = "[$1](https://worth-ai.atlassian.net/browse/$1)" },
              { pattern = '\(#([0-9]+)\)', replace = "([#$1](https://github.com/${{ github.repository }}/pull/$1))" }
          ]

          [git]
          conventional_commits = false
          filter_unconventional = false
          require_conventional = false
          split_commits = false
          commit_preprocessors = []
          protect_breaking_commits = false
          commit_parsers = [
              { message = "^feat", group = "<!-- 0 -->🚀 Features" },
              { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
              { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
              { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
              { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
              { message = "^style", group = "<!-- 5 -->🎨 Styling" },
              { message = "^test", group = "<!-- 6 -->🧪 Testing" },
              { message = "^chore\\(release\\): prepare for", skip = true },
              { message = "^chore\\(deps.*\\)", skip = true },
              { message = "^chore\\(pr\\)", skip = true },
              { message = "^chore\\(pull\\)", skip = true },
              { message = "^chore|^ci", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
              { body = ".*security", group = "<!-- 8 -->🛡️ Security" },
              { message = "^revert", group = "<!-- 9 -->◀️ Revert" },
              { message = ".*", group = "<!-- 10 -->💼 Other" },
          ]
          filter_commits = false
          link_parsers = [
              { pattern = "([A-Z]+-[0-9]+)", href = "https://worth-ai.atlassian.net/browse/$1" },
              { pattern = "#([0-9]+)", href = "https://github.com/${{ github.repository }}/pull/$1" }
          ]
          use_branch_tags = false
          topo_order = false
          topo_order_commits = true
          sort_commits = "oldest"
          recurse_submodules = false
          EOF

      - name: Generate changelog between tags
        run: |
          npx git-cliff@latest ${{ env.PREV_TAG }}..${{ env.CURRENT_TAG }} --output CHANGELOG.md   
          echo "Changelog generated successfully!"
      
      - name: Read changelog content
        id: changelog
        run: |
          echo "content<<EOF" >> $GITHUB_OUTPUT
          cat CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Draft Release Notes
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.changelog.outputs.content }}
          tag_name: ${{ env.CURRENT_TAG }}
          draft: true
          prerelease: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          
      # - name: Generate changelog
      #   uses: orhun/git-cliff-action@v4
      #   id: git-cliff
      #   with:
      #     config: cliff.toml
      #     args: -vv --tag ${{ env.PREV_TAG }}..${{ env.CURRENT_TAG }} --strip header
      #   env:
      #     OUTPUT: CHANGELOG.md
      #     GITHUB_REPO: ${{ github.repository }}

      # - name: Create Release Notes
      #   uses: softprops/action-gh-release@v2
      #   with:
      #     body: ${{ steps.git-cliff.outputs.content }}
      #     tag_name: ${{ env.CURRENT_TAG }}
      #     draft: true
      #     prerelease: false
      #     make_latest: false
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Commit, push changelog, and create PR
        run: |
          TARGET_BRANCH="chore/update-changelog-${{ env.CURRENT_TAG }}"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_ENV

          git config user.email "amanyadav63721@gmail.com"
          git config user.name "Aman29051"
          
          echo "${{ secrets.PERSONAL_ACCESS_TOKEN }}" > token.txt
          gh auth login --with-token < token.txt

          git checkout -b "$TARGET_BRANCH"
          git add CHANGELOG.md
          git commit -m "chore: update CHANGELOG for ${{ env.CURRENT_TAG }}" || echo "No changes to commit"
          git push origin "$TARGET_BRANCH"

          gh pr create \
            --body "This PR generates the `CHANGELOG.md` file to reflect changes from `${{ env.PREV_TAG }}` to `${{ env.CURRENT_TAG }}`." \
            --title "#NO_JIRA: #LIVE Generate  CHANGELOG for ${{ env.CURRENT_TAG }}" \
            --head "$TARGET_BRANCH" \
            --base "main"
