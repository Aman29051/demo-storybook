apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-db-dump
  namespace: db-dump
  labels:
    app: service-db
  annotations:
    deployment.kubernetes.io/revision: "1"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: service-db
  template:
    metadata:
      labels:
        app: service-db
    spec:
      serviceAccountName: s3-access-sa
      initContainers:
        - name: fetch-dump
          image: amazonlinux:2
          env:
            - name: KAMLESH_AUTH_DUMP_FILE
              value: "2025-08-23.sql"
            - name: PRASAD_AUTH_DUMP_FILE
              value: "latest"
            - name: SHREYASH_AUTH_DUMP_FILE
              value: "latest"
          command: ["/bin/bash", "-c"]
          args:
            - |
              yum install -y unzip awscli > /dev/null
              mkdir -p /shared/dump /tmp/kamlesh-temp /tmp/prasad-temp /tmp/shreyash-temp

              echo "[KAMLESH] Downloading dump..."
              if [ "$KAMLESH_AUTH_DUMP_FILE" != "" ] && [ "$KAMLESH_AUTH_DUMP_FILE" != "latest" ]; then
                echo "Using specified Kamlesh dump: $KAMLESH_AUTH_DUMP_FILE"
                aws s3 cp s3://worthai-dev-db-dump/auth/$KAMLESH_AUTH_DUMP_FILE /shared/dump/kamlesh.sql
              else
                echo "Fetching latest Kamlesh dump..."
                aws s3 cp s3://worthai-dev-db-dump/auth/ /tmp/kamlesh-temp/ --recursive --exclude "*" --include "*.sql"
                latest_kamlesh=$(ls -t /tmp/kamlesh-temp/*.sql | head -n1)
                echo "Using latest Kamlesh dump: $latest_kamlesh"
                cp "$latest_kamlesh" /shared/dump/kamlesh.sql
              fi

              echo "[PRASAD] Downloading dump..."
              if [ "$PRASAD_AUTH_DUMP_FILE" != "" ] && [ "$PRASAD_AUTH_DUMP_FILE" != "latest" ]; then
                echo "Using specified Prasad dump: $PRASAD_AUTH_DUMP_FILE"
                aws s3 cp s3://worthai-dev-db-dump/auth/$PRASAD_AUTH_DUMP_FILE /shared/dump/prasad.sql
              else
                echo "Fetching latest Prasad dump..."
                aws s3 cp s3://worthai-dev-db-dump/auth/ /tmp/prasad-temp/ --recursive --exclude "*" --include "*.sql"
                latest_prasad=$(ls -t /tmp/prasad-temp/*.sql | head -n1)
                echo "Using latest Prasad dump: $latest_prasad"
                cp "$latest_prasad" /shared/dump/prasad.sql
              fi

              echo "[SHREYASH] Downloading dump..."
              if [ "$SHREYASH_AUTH_DUMP_FILE" != "" ] && [ "$SHREYASH_AUTH_DUMP_FILE" != "latest" ]; then
                echo "Using specified Shreyash dump: $SHREYASH_AUTH_DUMP_FILE"
                aws s3 cp s3://worthai-dev-db-dump/auth/$SHREYASH_AUTH_DUMP_FILE /shared/dump/shreyash.sql
              else
                echo "Fetching latest shreyash dump..."
                aws s3 cp s3://worthai-dev-db-dump/auth/ /tmp/shreyash-temp/ --recursive --exclude "*" --include "*.sql"
                latest_shreyash=$(ls -t /tmp/shreyash-temp/*.sql | head -n1)
                echo "Using latest shreyash dump: $latest_shreyash"
                cp "$latest_shreyash" /shared/dump/shreyash.sql
              fi

              echo "All dumps downloaded successfully!"
              ls -la /shared/dump/
          volumeMounts:
            - name: dump-volume
              mountPath: /shared
      containers:
        - name: postgres-kamlesh
          image: pgvector/pgvector:pg16
          env:
            - name: POSTGRES_DB
              value: auth
            - name: POSTGRES_USER
              value: kamlesh
            - name: POSTGRES_PASSWORD
              value: admin
          ports:
            - containerPort: 5432
          livenessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 5432
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: dump-volume
              mountPath: /docker-entrypoint-initdb.d/01-kamlesh.sql
              subPath: dump/kamlesh.sql
        - name: postgres-prasad
          image: pgvector/pgvector:pg16
          env:
            - name: POSTGRES_DB
              value: auth
            - name: POSTGRES_USER
              value: prasad
            - name: POSTGRES_PASSWORD
              value: admin
          ports:
            - containerPort: 5433
          command: ["docker-entrypoint.sh"]
          args: ["postgres", "-p", "5433"]
          livenessProbe:
            tcpSocket:
              port: 5433
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 5433
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: dump-volume
              mountPath: /docker-entrypoint-initdb.d/01-prasad.sql
              subPath: dump/prasad.sql
        - name: postgres-shreyash
          image: pgvector/pgvector:pg16
          env:
            - name: POSTGRES_DB
              value: auth
            - name: POSTGRES_USER
              value: shreyash
            - name: POSTGRES_PASSWORD
              value: admin
          ports:
            - containerPort: 5434
          command: ["docker-entrypoint.sh"]
          args: ["postgres", "-p", "5434"]
          livenessProbe:
            tcpSocket:
              port: 5434
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: 5434
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: dump-volume
              mountPath: /docker-entrypoint-initdb.d/01-shreyash.sql
              subPath: dump/shreyash.sql
      volumes:
        - name: dump-volume
          emptyDir: {}
---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: service-db-dump-hpa
  namespace: db-dump
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: service-db-dump
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
        - type: Pods
          value: 1
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 10
          periodSeconds: 60
      selectPolicy: Min
  template:
    spec:
      initContainers:
        - env: []
---
spec:
  template:
    spec:
      initContainers:
        - env: []
